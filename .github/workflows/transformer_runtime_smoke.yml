name: Tata Transformer Runtime Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'tools/model/**'
      - '.github/workflows/transformer_runtime_smoke.yml'
  pull_request:
    paths:
      - 'tools/model/**'
      - '.github/workflows/transformer_runtime_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transformer-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install onnx onnxruntime
      - name: Run Transformer runtime and checkpoint safety tests
        run: python -m unittest tools.model.tests.test_transformer_runtime tools.model.tests.test_training_checkpoint tools.model.tests.test_export_transformer_onnx -v
