name: Tata Android Unit Tests

on:
  push:
    branches: [main, test/transformer-runtime-smoke]
    paths:
      - 'app/**'
      - 'onnx-poc/**'
      - 'tools/model/create_onnx_android_fixture.py'
      - 'tools/model/create_tata_transformer_android_fixture.py'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android_unit_tests.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'onnx-poc/**'
      - 'tools/model/create_onnx_android_fixture.py'
      - 'tools/model/create_tata_transformer_android_fixture.py'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android_unit_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate synthetic ONNX identity fixture
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install onnx==1.19.1
          python tools/model/create_onnx_android_fixture.py onnx-poc/src/androidTest/assets/tiny_identity.onnx
          python tools/model/create_tata_transformer_android_fixture.py onnx-poc/src/androidTest/assets/tata_transformer_synthetic.onnx --parity-output onnx-poc/src/androidTest/assets/tata_transformer_pytorch_reference.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Install Android NDK and CMake
        timeout-minutes: 15
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Run Android unit tests
        run: gradle testDebugUnitTest :onnx-poc:testDebugUnitTest --no-daemon

      - name: Build debug APKs without publishing them
        run: gradle assembleDebug :onnx-poc:assembleDebug --no-daemon

      - name: Upload debug APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tata-android-debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            onnx-poc/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
