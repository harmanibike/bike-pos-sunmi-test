name: Validate Tata AI Training Corpus

on:
  push:
    branches: [main]
    paths:
      - 'tools/corpus/**'
      - 'tools/model/**'
      - '.github/workflows/validate_corpus.yml'
  pull_request:
    paths:
      - 'tools/corpus/**'
      - 'tools/model/**'
      - '.github/workflows/validate_corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-corpus-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate synthetic non-private seed fixture
        working-directory: tools/corpus
        run: python validate_corpus.py examples/synthetic_sample.jsonl
      - name: Run corpus, split, and tokenizer unit tests
        working-directory: tools/corpus
        run: python -m unittest discover -s tests -v
      - name: Run Transformer configuration, data, and evaluation unit tests
        run: python -m unittest discover -s tools/model/tests -v
      - name: Check model scripts compile without loading ML dependencies
        run: python -m py_compile tools/corpus/audit_dataset.py tools/corpus/build_manifest.py tools/corpus/train_tokenizer.py tools/corpus/validate_source_register.py tools/model/transformer_config.py tools/model/training_data.py tools/model/train_transformer.py tools/model/evaluate_transformer.py tools/corpus/evaluate_tokenizer.py
